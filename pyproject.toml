[project]
name = "au-daily-news"
version = "0.1.0"
description = "A Python program to fetch ABC News Australia RSS feed and save entries from the past 24 hours as a markdown document"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
fetch-rss = "fetch_rss:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
